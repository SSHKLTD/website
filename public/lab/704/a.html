<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>LAB A · 一鏡到底 The Tracking Shot — 704 Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --paper:#F4F6F8; --card:#fff; --ink:#16181B; --alert:#F4652F; --link:#2469D4; --line:#E2E8EE; --grey:#535A63; --grey2:#8A93A0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--paper); color:var(--ink); font-family:'Sora',sans-serif; }
  .hud { position:fixed; inset:0 0 auto 0; z-index:10; display:flex; justify-content:space-between; align-items:center; padding:18px 28px; pointer-events:none; }
  .hud .brand { font:600 11px/1 'IBM Plex Mono',monospace; letter-spacing:.14em; color:var(--ink); }
  .hud .brand span { color:var(--link); }
  .hud .count { font:500 12px/1 'IBM Plex Mono',monospace; letter-spacing:.1em; color:var(--grey); font-variant-numeric:tabular-nums; }
  .progress { position:fixed; left:0; top:0; height:3px; background:var(--link); width:0; z-index:11; }
  .intro { position:fixed; left:28px; bottom:28px; z-index:10; max-width:320px; pointer-events:none; }
  .intro h1 { font-size:1.5rem; font-weight:800; letter-spacing:-.02em; line-height:1.15; }
  .intro p { font:500 10px/1.7 'IBM Plex Mono',monospace; letter-spacing:.1em; color:var(--grey2); margin-top:.6rem; text-transform:uppercase; }
  .track { height: 5200vh; }
  .stage { position:sticky; top:0; height:100vh; overflow:hidden; display:flex; align-items:center; }
  .reel { display:flex; gap:5vw; padding-left:38vw; will-change:transform; }
  .frame { flex:0 0 auto; width:44vw; }
  .frame img { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:16px; border:1px solid var(--line); box-shadow:0 24px 70px rgba(22,24,27,.13); display:block; background:#e4e9ee; }
  .frame figcaption { display:flex; gap:1rem; align-items:baseline; margin-top:14px; }
  .frame .n { font:600 11px/1 'IBM Plex Mono',monospace; color:var(--alert); }
  .frame .c { font:600 10px/1.5 'IBM Plex Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--link); }
  .frame .t { font-weight:700; font-size:1.02rem; letter-spacing:-.01em; }
  .frame a { color:inherit; text-decoration:none; }
  .frame a:hover .t { color:var(--link); }
  .endcard { flex:0 0 auto; width:60vw; display:flex; align-items:center; }
  .endcard div h2 { font-size:2.4rem; font-weight:800; letter-spacing:-.02em; }
  .endcard div p { font:500 11px/1.8 'IBM Plex Mono',monospace; letter-spacing:.1em; color:var(--grey); margin-top:1rem; }
  @media (max-width: 900px) {
    .track { height:auto; } .stage { position:static; height:auto; overflow-x:auto; padding:110px 0 40px; }
    .reel { padding:0 6vw; transform:none !important; } .frame { width:78vw; } .intro { display:none; }
  }
</style>
</head>
<body>
<div class="progress" id="bar"></div>
<header class="hud">
  <span class="brand">704 PRODUCTION · <span>LAB A</span> · 一鏡到底 THE TRACKING SHOT</span>
  <span class="count" id="count">001 / 117</span>
</header>
<aside class="intro">
  <h1>One take.<br />117 productions.</h1>
  <p>Scroll down — the camera dollies right through the entire log.</p>
</aside>
<div class="track" id="track">
  <div class="stage">
    <div class="reel" id="reel"></div>
  </div>
</div>
<script src="data.js"></script>
<script>
  const reel = document.getElementById('reel');
  reel.innerHTML = JOBS.map((j, i) => `
    <figure class="frame">
      <a href="${j.link}" target="_blank" rel="noopener">
        <img src="/images/704/${j.slug}.webp" alt="" loading="lazy" />
        <figcaption><span class="n">${String(i + 1).padStart(3, '0')}</span>
          <span><span class="c">${j.client}</span><br /><span class="t">${j.title}</span></span>
        </figcaption>
      </a>
    </figure>`).join('') +
    `<div class="endcard"><div><h2>Cut.<br/>That's the log.</h2><p>117 PRODUCTIONS · 50 CLIENTS · SINCE 2020</p></div></div>`;
  const track = document.getElementById('track'), bar = document.getElementById('bar'), count = document.getElementById('count');
  const mq = matchMedia('(min-width: 901px)');
  function onScroll() {
    if (!mq.matches) return;
    const r = track.getBoundingClientRect();
    const total = r.height - innerHeight;
    const p = Math.min(1, Math.max(0, -r.top / total));
    const max = reel.scrollWidth - innerWidth * 0.62;
    reel.style.transform = `translateX(${-p * max}px)`;
    bar.style.width = (p * 100) + '%';
    count.textContent = String(Math.min(117, Math.max(1, Math.round(p * 117)))).padStart(3, '0') + ' / 117';
  }
  addEventListener('scroll', onScroll, { passive: true }); onScroll();
</script>
</body>
</html>
