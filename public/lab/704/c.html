<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>LAB C · 放映室 The Screening Room — 704 Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --paper:#F4F6F8; --ink:#101215; --panel:#16181B; --alert:#F4652F; --link:#4B8DF0; --line:#2A2E34; --grey:#9AA4B0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:#fff; font-family:'Sora',sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:center; padding:20px 28px; }
  .brand { font:600 11px/1 'IBM Plex Mono',monospace; letter-spacing:.14em; color:var(--grey); }
  .brand b { color:#fff; }
  .now { font:500 10.5px/1 'IBM Plex Mono',monospace; letter-spacing:.1em; color:var(--alert); display:flex; gap:8px; align-items:center; }
  .now::before { content:''; width:8px; height:8px; border-radius:50%; background:var(--alert); animation:pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  .screen-wrap { padding:0 28px; }
  .screen { position:relative; border-radius:18px; overflow:hidden; border:1px solid var(--line); aspect-ratio:21/9; max-height:62vh; margin:0 auto; width:100%; background:#000; }
  .screen img, .screen iframe { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border:0; }
  .screen .veil { position:absolute; inset:0; background:linear-gradient(180deg, transparent 40%, rgba(0,0,0,.72)); }
  .screen .slate { position:absolute; left:26px; bottom:22px; right:26px; display:flex; justify-content:space-between; align-items:end; gap:2rem; }
  .slate .c { font:600 10.5px/1.6 'IBM Plex Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--alert); }
  .slate .t { font-size:clamp(1.1rem,2.4vw,1.9rem); font-weight:800; letter-spacing:-.015em; max-width:26ch; }
  .playbtn { flex-shrink:0; font:600 11px/1 'IBM Plex Mono',monospace; letter-spacing:.1em; color:#fff; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.4); backdrop-filter:blur(6px); border-radius:999px; padding:.9em 1.6em; cursor:pointer; }
  .playbtn:hover { background:var(--alert); border-color:var(--alert); }
  .tabs { display:flex; gap:.4rem; flex-wrap:wrap; padding:22px 28px 12px; }
  .tab { font:500 10.5px/1 'IBM Plex Mono',monospace; letter-spacing:.08em; cursor:pointer; color:var(--grey); background:transparent; border:1px solid var(--line); border-radius:999px; padding:.55em 1.05em; }
  .tab.on { background:#fff; color:#101215; border-color:#fff; }
  .strip { display:flex; gap:10px; overflow-x:auto; padding:6px 28px 30px; scrollbar-width:thin; }
  .cellw { flex:0 0 auto; scroll-snap-align:start; }
  .cell { display:block; width:190px; aspect-ratio:16/9; border-radius:10px; overflow:hidden; border:2px solid transparent; cursor:pointer; background:#22262b; padding:0; }
  .cell img { width:100%; height:100%; object-fit:cover; display:block; opacity:.55; transition:opacity .25s; }
  .cell:hover img { opacity:.9; }
  .cell.on { border-color:var(--alert); } .cell.on img { opacity:1; }
  .cellw.hide { display:none; }
  .cellw p { font:500 9px/1.4 'IBM Plex Mono',monospace; letter-spacing:.08em; color:var(--grey); margin-top:6px; max-width:190px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-transform:uppercase; }
  @media (max-width:760px) { .screen { aspect-ratio:16/10; } .cell { width:140px; } }
</style>
</head>
<body>
<header>
  <span class="brand"><b>704 PRODUCTION</b> · LAB C · 放映室 THE SCREENING ROOM</span>
  <span class="now">NOW SCREENING</span>
</header>
<div class="screen-wrap">
  <div class="screen" id="screen">
    <img id="still" src="" alt="" />
    <div class="veil"></div>
    <div class="slate">
      <div><div class="c" id="s-client"></div><div class="t" id="s-title"></div></div>
      <button class="playbtn" id="play">▶ ROLL</button>
    </div>
  </div>
</div>
<div class="tabs" id="tabs"></div>
<div class="strip" id="strip"></div>
<script src="data.js"></script>
<script>
  const FORMATS = ['All','Campaign','Event Highlight','Reels','Interview','Animation','Variety Show','Drama','Live Streaming'];
  let current = 0;
  const still = document.getElementById('still'), sc = document.getElementById('s-client'), st = document.getElementById('s-title');
  const screen = document.getElementById('screen'), play = document.getElementById('play');
  const strip = document.getElementById('strip'), tabs = document.getElementById('tabs');
  strip.innerHTML = JOBS.map((j, i) => `
    <div class="cellw${j.thumb ? '' : ' hide'}" data-f="${j.formats.join('|')}">
      <button class="cell" data-i="${i}"><img src="/images/704/${j.slug}.webp" alt="" loading="lazy" /></button>
      <p>${j.client}</p>
    </div>`).join('');
  tabs.innerHTML = FORMATS.map((f, i) => `<button class="tab${i === 0 ? ' on' : ''}" data-v="${f === 'All' ? '' : f}">${f.toUpperCase()}</button>`).join('');
  function select(i) {
    current = i; const j = JOBS[i];
    const old = screen.querySelector('iframe'); if (old) old.remove();
    still.src = `/images/704/${j.slug}.webp`;
    sc.textContent = j.client; st.textContent = j.title;
    strip.querySelectorAll('.cell').forEach((c) => c.classList.toggle('on', +c.dataset.i === i));
  }
  strip.addEventListener('click', (e) => { const c = e.target.closest('.cell'); if (c) select(+c.dataset.i); });
  play.addEventListener('click', () => {
    const j = JOBS[current];
    const m = j.link.match(/vimeo\.com\/(\d+)/);
    const yt = j.link.match(/youtu\.be\/([\w-]+)/);
    const src = m ? `https://player.vimeo.com/video/${m[1]}?autoplay=1` : yt ? `https://www.youtube.com/embed/${yt[1]}?autoplay=1` : '';
    if (!src) { window.open(j.link, '_blank'); return; }
    const f = document.createElement('iframe');
    f.src = src; f.allow = 'autoplay; fullscreen'; f.allowFullscreen = true;
    screen.appendChild(f);
  });
  tabs.addEventListener('click', (e) => {
    const b = e.target.closest('.tab'); if (!b) return;
    tabs.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t === b));
    const v = b.dataset.v;
    strip.querySelectorAll('.cellw').forEach((w) => w.classList.toggle('hide', v && !w.dataset.f.split('|').includes(v)));
  });
  select(0);
</script>
</body>
</html>
