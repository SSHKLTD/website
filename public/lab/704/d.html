<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>LAB D · 節目表 The Programme Guide — 704 Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --paper:#F4F6F8; --card:#fff; --ink:#16181B; --alert:#F4652F; --link:#2469D4; --line:#E2E8EE; --grey:#535A63; --grey2:#8A93A0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--paper); color:var(--ink); font-family:'Sora',sans-serif; }
  header { padding:44px clamp(20px,4vw,52px) 20px; display:flex; flex-wrap:wrap; align-items:end; justify-content:space-between; gap:1rem 2rem; }
  .brand { font:600 11px/1 'IBM Plex Mono',monospace; letter-spacing:.14em; color:var(--link); }
  h1 { font-size:clamp(1.8rem,4vw,3rem); font-weight:800; letter-spacing:-.022em; margin-top:.55rem; }
  .note { font:500 10.5px/1.7 'IBM Plex Mono',monospace; letter-spacing:.1em; color:var(--grey2); text-transform:uppercase; text-align:right; }
  .channel { border-top:1px solid var(--line); padding:26px 0 30px; }
  .ch-head { display:flex; align-items:baseline; gap:1.1rem; padding:0 clamp(20px,4vw,52px); margin-bottom:16px; }
  .ch-no { font:600 11px/1 'IBM Plex Mono',monospace; letter-spacing:.1em; color:var(--alert); }
  .ch-name { font-weight:800; font-size:1.25rem; letter-spacing:-.015em; }
  .ch-count { font:500 10.5px/1 'IBM Plex Mono',monospace; letter-spacing:.1em; color:var(--grey2); }
  .ch-arrow { margin-left:auto; font:500 10.5px/1 'IBM Plex Mono',monospace; color:var(--grey2); letter-spacing:.1em; }
  .row { display:flex; gap:12px; overflow-x:auto; padding:2px clamp(20px,4vw,52px) 12px; scroll-snap-type:x proximity; scrollbar-width:thin; }
  .slot { flex:0 0 auto; width:280px; scroll-snap-align:start; text-decoration:none; color:inherit; }
  .slot .fr { position:relative; aspect-ratio:16/9; border-radius:12px; overflow:hidden; border:1px solid var(--line); background:#e4e9ee; }
  .slot img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s cubic-bezier(.2,.8,.2,1); }
  .slot:hover img { transform:scale(1.05); }
  .slot .play { position:absolute; right:9px; bottom:9px; width:26px; height:26px; border-radius:50%; background:rgba(22,24,27,.8); color:#fff; font-size:.55rem; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .25s; }
  .slot:hover .play { opacity:1; }
  .slot .c { font:600 9.5px/1.5 'IBM Plex Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--grey2); display:block; margin-top:9px; }
  .slot .t { font-weight:700; font-size:.9rem; line-height:1.4; display:block; margin-top:2px; }
  .slot:hover .t { color:var(--link); }
  footer { border-top:1px solid var(--line); padding:30px clamp(20px,4vw,52px) 60px; font:500 10.5px/1.8 'IBM Plex Mono',monospace; letter-spacing:.1em; color:var(--grey2); }
</style>
</head>
<body>
<header>
  <div>
    <span class="brand">704 PRODUCTION · LAB D · 節目表 THE PROGRAMME GUIDE</span>
    <h1>Eight channels,<br />always on air.</h1>
  </div>
  <p class="note">EACH CHANNEL SCROLLS RIGHT →<br />CLICK ANY SLOT TO SCREEN IT</p>
</header>
<main id="guide"></main>
<footer>117 PRODUCTIONS · 50 CLIENTS · SINCE 2020 · A JOB CAN AIR ON MORE THAN ONE CHANNEL</footer>
<script src="data.js"></script>
<script>
  const FORMATS = ['Campaign','Event Highlight','Reels','Interview','Animation','Variety Show','Drama','Live Streaming'];
  const ZH = { 'Campaign':'品牌企劃','Event Highlight':'活動精華','Reels':'短片','Interview':'訪談','Animation':'動畫','Variety Show':'綜藝','Drama':'劇情','Live Streaming':'直播' };
  document.getElementById('guide').innerHTML = FORMATS.map((f, ci) => {
    const items = JOBS.filter((j) => j.formats.includes(f) && j.thumb);
    return `<section class="channel">
      <div class="ch-head">
        <span class="ch-no">CH·${String(ci + 1).padStart(2, '0')}</span>
        <span class="ch-name">${f} <span style="color:var(--grey2);font-weight:600;">${ZH[f]}</span></span>
        <span class="ch-count">${items.length} TITLES</span>
        <span class="ch-arrow">SCROLL →</span>
      </div>
      <div class="row">${items.map((j) => `
        <a class="slot" href="${j.link}" target="_blank" rel="noopener">
          <span class="fr"><img src="/images/704/${j.slug}.webp" alt="" loading="lazy" /><span class="play">▶</span></span>
          <span class="c">${j.client}</span><span class="t">${j.title}</span>
        </a>`).join('')}
      </div>
    </section>`;
  }).join('');
</script>
</body>
</html>
