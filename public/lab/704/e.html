<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>LAB E · 通告單 The Call Sheet — 704 Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --paper:#F4F6F8; --card:#fff; --ink:#16181B; --alert:#F4652F; --link:#2469D4; --line:#E2E8EE; --grey:#535A63; --grey2:#8A93A0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--paper); color:var(--ink); font-family:'Sora',sans-serif; }
  .layout { display:grid; grid-template-columns:minmax(420px,44%) 1fr; }
  .list { border-right:1px solid var(--line); }
  .list-head { padding:40px 34px 22px; position:sticky; top:0; background:var(--paper); border-bottom:1px solid var(--line); z-index:2; }
  .brand { font:600 11px/1 'IBM Plex Mono',monospace; letter-spacing:.14em; color:var(--link); }
  h1 { font-size:clamp(1.6rem,2.6vw,2.3rem); font-weight:800; letter-spacing:-.02em; margin-top:.5rem; }
  .hint { font:500 10px/1.7 'IBM Plex Mono',monospace; letter-spacing:.1em; color:var(--grey2); margin-top:.5rem; text-transform:uppercase; }
  .rows { list-style:none; padding:0 0 60px; }
  .rows a { display:grid; grid-template-columns:3.4rem 1fr auto; gap:1rem; align-items:baseline; padding:13px 34px; border-top:1px solid var(--line); text-decoration:none; color:inherit; }
  .rows .n { font:500 10.5px/1 'IBM Plex Mono',monospace; color:var(--grey2); }
  .rows .t { font-weight:700; font-size:.94rem; line-height:1.4; }
  .rows .c { font:500 9.5px/1.5 'IBM Plex Mono',monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--grey2); white-space:nowrap; }
  .rows li.on a { background:var(--card); }
  .rows li.on .n { color:var(--alert); }
  .rows li.on .t { color:var(--link); }
  .preview { position:sticky; top:0; height:100vh; display:flex; flex-direction:column; justify-content:center; padding:40px clamp(24px,4vw,60px); }
  .pv-frame { position:relative; border-radius:18px; overflow:hidden; border:1px solid var(--line); box-shadow:0 30px 80px rgba(22,24,27,.14); aspect-ratio:16/9; background:#e4e9ee; }
  .pv-frame img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .35s ease; }
  .pv-frame img.show { opacity:1; }
  .pv-num { position:absolute; top:14px; left:16px; font:600 11px/1 'IBM Plex Mono',monospace; letter-spacing:.1em; color:#fff; background:rgba(22,24,27,.7); border-radius:999px; padding:6px 11px; }
  .pv-meta { display:flex; justify-content:space-between; align-items:baseline; gap:2rem; margin-top:18px; }
  .pv-client { font:600 10.5px/1.6 'IBM Plex Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--alert); }
  .pv-title { font-size:1.25rem; font-weight:800; letter-spacing:-.015em; max-width:30ch; }
  .pv-tags { font:500 10px/1.6 'IBM Plex Mono',monospace; letter-spacing:.1em; color:var(--grey2); text-transform:uppercase; text-align:right; }
  @media (max-width:900px) {
    .layout { grid-template-columns:1fr; }
    .preview { display:none; }
    .rows a { grid-template-columns:2.6rem 1fr; } .rows .c { display:none; }
  }
</style>
</head>
<body>
<div class="layout">
  <div class="list">
    <div class="list-head">
      <span class="brand">704 PRODUCTION · LAB E · 通告單 THE CALL SHEET</span>
      <h1>The log, read<br />like a call sheet.</h1>
      <p class="hint">Move down the list — the monitor follows. Click to screen.</p>
    </div>
    <ul class="rows" id="rows"></ul>
  </div>
  <aside class="preview">
    <div class="pv-frame" id="pv"><span class="pv-num" id="pv-num">001</span></div>
    <div class="pv-meta">
      <div><div class="pv-client" id="pv-client"></div><div class="pv-title" id="pv-title"></div></div>
      <div class="pv-tags" id="pv-tags"></div>
    </div>
  </aside>
</div>
<script src="data.js"></script>
<script>
  const rows = document.getElementById('rows');
  rows.innerHTML = JOBS.map((j, i) => `
    <li data-i="${i}"><a href="${j.link}" target="_blank" rel="noopener">
      <span class="n">${String(i + 1).padStart(3, '0')}</span>
      <span class="t">${j.title}</span>
      <span class="c">${j.client}</span>
    </a></li>`).join('');
  const pv = document.getElementById('pv'), num = document.getElementById('pv-num');
  const pc = document.getElementById('pv-client'), pt = document.getElementById('pv-title'), pg = document.getElementById('pv-tags');
  const imgs = {};
  let active = -1;
  function show(i) {
    if (i === active) return; active = i;
    const j = JOBS[i];
    rows.querySelectorAll('li').forEach((li) => li.classList.toggle('on', +li.dataset.i === i));
    if (!imgs[i]) {
      const im = document.createElement('img');
      im.src = `/images/704/${j.slug}.webp`; pv.appendChild(im); imgs[i] = im;
    }
    Object.values(imgs).forEach((im) => im.classList.remove('show'));
    imgs[i].classList.add('show');
    num.textContent = String(i + 1).padStart(3, '0');
    pc.textContent = j.client; pt.textContent = j.title;
    pg.innerHTML = j.formats.join('<br />');
  }
  const io = new IntersectionObserver((es) => {
    es.forEach((e) => { if (e.isIntersecting) show(+e.target.dataset.i); });
  }, { rootMargin: '-46% 0px -46% 0px' });
  rows.querySelectorAll('li').forEach((li) => io.observe(li));
  rows.addEventListener('mouseover', (e) => { const li = e.target.closest('li'); if (li) show(+li.dataset.i); });
  show(0);
</script>
</body>
</html>
